plugins {
    id 'com.android.application'
}

android {
    namespace 'com.nitsutech.watchbridge'
    compileSdk 34

    defaultConfig {
        applicationId "com.nitsutech.watchbridge"
        minSdk 30
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        viewBinding false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.wear:wear:1.3.0'

    // Wearable Data Layer
    implementation 'com.google.android.gms:play-services-wearable:18.1.0'

    // Wear OS Tiles & Watch Face Complications
    implementation 'androidx.wear.tiles:tiles:1.3.0'
    implementation 'androidx.wear.protolayout:protolayout:1.1.0'
    implementation 'androidx.wear.protolayout:protolayout-material:1.1.0'
    implementation 'androidx.wear.protolayout:protolayout-expression:1.1.0'
    implementation 'androidx.wear.watchface:watchface-complications-data-source:1.2.1'
    implementation 'com.google.guava:guava:31.1-android'

    implementation 'com.google.code.gson:gson:2.10.1'

    testImplementation 'junit:junit:4.13.2'
}
